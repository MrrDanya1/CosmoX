name: Build CosmoX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CosmoX
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout official XTLS libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          path: libxray
          fetch-depth: 1

      - name: Set up Go from libXray go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: libxray/go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build native Xray Android AAR
        working-directory: libxray
        run: |
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p ../app/libs
          cp libXray.aar ../app/libs/libXray.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build CosmoX APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmoX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
